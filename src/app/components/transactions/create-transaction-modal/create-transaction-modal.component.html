<!-- Backdrop -->
<div
  [@fadeSlide]
  (click)="onCancel()"
  class="fixed inset-0 z-50 bg-black/30 backdrop-blur-sm"
></div>

<!-- Modal -->
<div
  [@fadeSlide]
  class="fixed left-1/2 top-1/2 z-50 w-[90vw] max-w-lg -translate-x-1/2 -translate-y-1/2 rounded-lg border bg-background p-6 shadow-lg"
>
  <!-- Header -->
  <div class="flex flex-col space-y-1.5 text-center sm:text-left">
    <h2 class="text-lg font-semibold leading-none tracking-tight">
      {{ isEditMode ? 'Editar transação' : 'Nova transação' }}
    </h2>
    <p class="text-sm text-muted-foreground">
      {{ isEditMode ? 'Edite os detalhes da transação' : 'Adicione uma nova transação' }}
    </p>
  </div>

  <!-- Form -->
  <form (ngSubmit)="onCreate()">
    <div class="grid gap-4 py-4">

      <!-- Descrição -->
      <div class="grid gap-2">
        <label class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70">
          Descrição
        </label>
        <input
          [(ngModel)]="description"
          name="description"
          type="text"
          required
          placeholder="Ex: Compra no mercado"
          class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-base ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium file:text-foreground placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 md:text-sm"
        />
      </div>

      <!-- Valor -->
      <div class="grid gap-2">
        <label class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70">
          Valor
        </label>
        <input
          type="number"
          [(ngModel)]="amount"
          name="amount"
          required
          step="0.01"
          placeholder="Ex: 150.00"
          class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-base ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium file:text-foreground placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 md:text-sm"
        />
      </div>

      <!-- Data -->
      <div class="grid gap-2">
        <label class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70">
          Data
        </label>
        <input
          type="date"
          [(ngModel)]="transactionDate"
          name="transactionDate"
          required
          class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-base ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium file:text-foreground placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 md:text-sm"
        />
      </div>

      <!-- Tipo -->
      <div class="grid gap-2">
        <div class="relative">
          <label class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70">
            Tipo
          </label>

          <button
            type="button"
            (click)="toggleTypeDropdown()"
            class="inline-flex items-center gap-2 whitespace-nowrap rounded-md border border-input bg-background px-3 py-2 text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 h-10 w-full justify-between"
          >
            {{ getTypeDisplayName(type) || 'Selecione um tipo' }}
            <mat-icon *ngIf="typeDropdownOpen" class="lucide ml-2 h-4 w-4 shrink-0 opacity-50">keyboard_arrow_up</mat-icon>
            <mat-icon *ngIf="!typeDropdownOpen" class="lucide ml-2 h-4 w-4 shrink-0 opacity-50">keyboard_arrow_down</mat-icon>
          </button>

          <ul *ngIf="typeDropdownOpen" class="absolute z-50 mt-1 max-h-60 w-full overflow-auto rounded-md border border-input bg-background text-sm shadow-lg">
            <li
              (click)="selectType('WITHDRAW')"
              [ngClass]="{ 'bg-accent text-accent-foreground': type === 'WITHDRAW' }"
              class="cursor-pointer px-3 py-2 hover:bg-accent hover:text-accent-foreground"
            >
              Saída
            </li>
            <li
              (click)="selectType('DEPOSIT')"
              [ngClass]="{ 'bg-accent text-accent-foreground': type === 'DEPOSIT' }"
              class="cursor-pointer px-3 py-2 hover:bg-accent hover:text-accent-foreground"
            >
              Entrada
            </li>
            <li
              (click)="selectType('TRANSFER')"
              [ngClass]="{ 'bg-accent text-accent-foreground': type === 'TRANSFER' }"
              class="cursor-pointer px-3 py-2 hover:bg-accent hover:text-accent-foreground"
            >
              Transferência
            </li>
          </ul>
        </div>
      </div>

      <!-- Categoria -->
      <div class="grid gap-2">
        <div class="relative">
          <label class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70">
            Categoria
          </label>

          <button
            type="button"
            (click)="toggleCategoryDropdown()"
            class="inline-flex items-center gap-2 whitespace-nowrap rounded-md border border-input bg-background px-3 py-2 text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 h-10 w-full justify-between"
          >
            {{ selectedCategory?.description || 'Selecione uma categoria' }}
            <mat-icon *ngIf="categoryDropdownOpen" class="lucide ml-2 h-4 w-4 shrink-0 opacity-50">keyboard_arrow_up</mat-icon>
            <mat-icon *ngIf="!categoryDropdownOpen" class="lucide ml-2 h-4 w-4 shrink-0 opacity-50">keyboard_arrow_down</mat-icon>
          </button>

          <ul *ngIf="categoryDropdownOpen" class="absolute z-50 mt-1 max-h-60 w-full overflow-auto rounded-md border border-input bg-background text-sm shadow-lg">
            <li
              *ngFor="let cat of categories"
              (click)="selectCategory(cat)"
              [ngClass]="{ 'bg-accent text-accent-foreground': selectedCategory?.id === cat.id }"
              class="cursor-pointer px-3 py-2 hover:bg-accent hover:text-accent-foreground"
            >
              {{ cat.description }}
            </li>
          </ul>
        </div>
      </div>

      <!-- Conta -->
      <div class="grid gap-2">
        <div class="relative">
          <label class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70">
            Conta
          </label>

          <button
            type="button"
            (click)="toggleAccountDropdown()"
            class="inline-flex items-center gap-2 whitespace-nowrap rounded-md border border-input bg-background px-3 py-2 text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 h-10 w-full justify-between"
          >
            {{ selectedAccount?.description || 'Selecione uma conta' }}
            <mat-icon *ngIf="accountDropdownOpen" class="lucide ml-2 h-4 w-4 shrink-0 opacity-50">keyboard_arrow_up</mat-icon>
            <mat-icon *ngIf="!accountDropdownOpen" class="lucide ml-2 h-4 w-4 shrink-0 opacity-50">keyboard_arrow_down</mat-icon>
          </button>

          <ul *ngIf="accountDropdownOpen" class="absolute z-50 mt-1 max-h-60 w-full overflow-auto rounded-md border border-input bg-background text-sm shadow-lg">
            <li
              *ngFor="let acc of accounts"
              (click)="selectAccount(acc)"
              [ngClass]="{ 'bg-accent text-accent-foreground': selectedAccount?.id === acc.id }"
              class="cursor-pointer px-3 py-2 hover:bg-accent hover:text-accent-foreground"
            >
              {{ acc.description }}
            </li>
          </ul>
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="md:w-[calc(50%-8px)] grid grid-cols-1 md:grid-cols-2 gap-4 ml-auto">
      <button
        type="button"
        (click)="onCancel()"
        class="inline-flex items-center justify-center gap-2 rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 [&_svg]:pointer-events-none [&_svg]:size-4 [&_svg]:shrink-0 border border-input bg-background hover:bg-accent hover:text-accent-foreground h-10 px-4"
      >
        Cancelar
      </button>

      <button
        type="submit"
        class="inline-flex items-center justify-center gap-2 rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 [&_svg]:pointer-events-none [&_svg]:size-4 [&_svg]:shrink-0 bg-primary text-primary-foreground hover:bg-primary/90 h-10 px-4 py-1"
      >
        {{ isEditMode ? 'Salvar alterações' : 'Criar transação' }}
      </button>
    </div>
  </form>
</div>
