<div [@fadeSlide] (click)="cancel.emit()" class="fixed inset-0 z-50 bg-black/30 backdrop-blur-sm"></div>

<div [@fadeSlide] class="fixed left-[50%] top-[50%] z-50 w-full max-w-lg translate-x-[-50%] translate-y-[-50%] gap-4 border bg-background p-6 shadow-lg duration-200 rounded-lg">
  <div class="flex flex-col space-y-1.5 mb-4">
    <h2 class="text-lg font-semibold">Filtrar Assinaturas</h2>
    <p class="text-sm text-muted-foreground">Refine sua busca por critérios específicos</p>
  </div>

  <div class="grid gap-4">
    <div class="grid gap-2">
      <label class="text-sm font-medium">Descrição</label>
      <input [(ngModel)]="filters.description" class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm" placeholder="Buscar por descrição">
    </div>

    <div class="grid gap-2 relative">
      <label class="text-sm font-medium">Intervalo</label>
      <button (click)="intervalDropdownOpen = !intervalDropdownOpen; statusDropdownOpen = false; accountDropdownOpen = false" class="flex h-10 w-full items-center justify-between rounded-md border border-input bg-background px-3 py-2 text-sm">
        {{ getLabel(intervals, filters.interval) }}
        <mat-icon class="h-4 w-4 opacity-50">keyboard_arrow_down</mat-icon>
      </button>
      <ul *ngIf="intervalDropdownOpen" class="absolute z-10 top-full mt-1 w-full rounded-md border bg-background shadow-lg">
        <li *ngFor="let i of intervals" (click)="filters.interval = i.value; intervalDropdownOpen = false" class="cursor-pointer px-3 py-2 text-sm hover:bg-accent hover:text-accent-foreground">{{ i.label }}</li>
      </ul>
    </div>

    <div class="grid gap-2 relative">
      <label class="text-sm font-medium">Status</label>
      <button (click)="statusDropdownOpen = !statusDropdownOpen; intervalDropdownOpen = false; accountDropdownOpen = false" class="flex h-10 w-full items-center justify-between rounded-md border border-input bg-background px-3 py-2 text-sm">
        {{ getLabel(statuses, filters.status) }}
        <mat-icon class="h-4 w-4 opacity-50">keyboard_arrow_down</mat-icon>
      </button>
      <ul *ngIf="statusDropdownOpen" class="absolute z-10 top-full mt-1 w-full rounded-md border bg-background shadow-lg">
        <li *ngFor="let s of statuses" (click)="filters.status = s.value; statusDropdownOpen = false" class="cursor-pointer px-3 py-2 text-sm hover:bg-accent hover:text-accent-foreground">{{ s.label }}</li>
      </ul>
    </div>

    <div class="grid gap-2 relative">
      <label class="text-sm font-medium">Conta</label>
      <button (click)="accountDropdownOpen = !accountDropdownOpen; intervalDropdownOpen = false; statusDropdownOpen = false" class="flex h-10 w-full items-center justify-between rounded-md border border-input bg-background px-3 py-2 text-sm">
        {{ getAccountLabel(filters.accountId) }}
        <mat-icon class="h-4 w-4 opacity-50">keyboard_arrow_down</mat-icon>
      </button>
      <ul *ngIf="accountDropdownOpen" class="absolute z-10 top-full mt-1 w-full max-h-60 overflow-auto rounded-md border bg-background shadow-lg">
        <li (click)="filters.accountId = undefined; accountDropdownOpen = false" class="cursor-pointer px-3 py-2 text-sm hover:bg-accent hover:text-accent-foreground">Todas</li>
        <li *ngFor="let acc of accounts" (click)="filters.accountId = acc.id; accountDropdownOpen = false" class="cursor-pointer px-3 py-2 text-sm hover:bg-accent hover:text-accent-foreground">{{ acc.description }}</li>
      </ul>
    </div>
  </div>

  <div class="flex flex-col-reverse sm:flex-row justify-end gap-2 mt-6">
    <button (click)="onClear()" class="inline-flex items-center justify-center rounded-md text-sm font-medium border border-input h-10 px-4 hover:bg-accent">Limpar</button>
    <button (click)="onApply()" class="inline-flex items-center justify-center rounded-md text-sm font-medium bg-primary text-primary-foreground h-10 px-4 hover:bg-primary/90">Aplicar Filtros</button>
  </div>
</div>
